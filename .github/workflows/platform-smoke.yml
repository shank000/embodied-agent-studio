name: Platform smoke

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Core / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Fetch pinned Panda and SO-101 models
        uses: actions/checkout@v7
        with:
          repository: google-deepmind/mujoco_menagerie
          ref: 822c2d8f877dd166c5b7d3c9f7e3c3b6589473b7
          path: vendor/mujoco_menagerie
          sparse-checkout: |
            franka_emika_panda
            robotstudio_so101
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Create project Python environment
        run: python -m venv .venv

      - name: Install Python dependencies through the shared launcher
        run: node tools/python.mjs -m pip install -r requirements.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Check frontend state
        run: npm run test:ui

      - name: Check cross-platform launcher
        run: npm run test:launcher

      - name: Check Codex lookup and paused image stream
        run: node tools/python.mjs -m unittest tests.test_codex_executable tests.test_stream -v

      - name: Check real robot motion
        run: node tools/python.mjs -m unittest tests.test_simulation.PhysicsTests.test_real_models_and_actuated_joint_motion -v

      - name: Check environment task criteria and completion gates
        run: node tools/python.mjs -m unittest tests.test_task_evaluation tests.test_completion_controllers tests.test_research_discrete -v

      - name: Check experiment records, recovery, costs and training exports
        run: node tools/python.mjs -m unittest tests.test_round_training_costs tests.test_telemetry tests.test_pricing tests.test_recovery tests.test_recovery_provider_operations tests.test_robodojo_export -v

      - name: Check simulator isolation, selection and experiment identity
        run: node tools/python.mjs -m unittest tests.test_backend_process tests.test_backend_lifecycle tests.test_controller_start_stop tests.test_simulator_selection tests.test_analysis_simulators tests.test_environment_registry tests.test_discrete_agent tests.test_household_backends tests.test_alfworld_thor tests.test_setup_alfworld_thor tests.test_isaac_backend tests.test_libero_backend tests.test_maniskill_backend tests.test_robocasa_backend tests.test_robodojo tests.test_robodojo_catalog_results tests.test_setup_robodojo tests.test_setup_robocasa365 -v

  linux-rendering:
    name: Native rendering / Linux OSMesa
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MUJOCO_GL: osmesa

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Fetch pinned Panda and SO-101 models
        uses: actions/checkout@v7
        with:
          repository: google-deepmind/mujoco_menagerie
          ref: 822c2d8f877dd166c5b7d3c9f7e3c3b6589473b7
          path: vendor/mujoco_menagerie
          sparse-checkout: |
            franka_emika_panda
            robotstudio_so101
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install software rendering and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libosmesa6
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt

      - name: Check native rendering and service controls
        run: .venv/bin/python -m unittest tests.test_simulation.NativeServiceTests.test_render_pause_single_step_model_switch_and_resume tests.test_agent.VisualLoopTests.test_closed_drawer_rejects_false_done_reobserves_and_archives_evidence -v
